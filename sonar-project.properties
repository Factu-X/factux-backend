sonar.projectName=FactuX Backend
sonar.sources=src
sonar.tests=tests
sonar.exclusions=node_modules/**,dist/**,coverage/**,src/prisma/contract.d.ts,src/prisma/contract.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
# Scripts de consola y arranque del servidor: no son logica de la app y no se prueban con unit tests.
sonar.coverage.exclusions=src/scripts/**,src/server.ts
